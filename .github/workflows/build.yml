name: Build Arc Injector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          echo "Android SDK 34: OK"
          echo "Build Tools 34.0.0: OK"

      - name: Install Gradle 8.1
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.1-bin.zip \
            -o /tmp/gradle.zip

          rm -rf "$HOME/gradle-8.1"
          mkdir -p "$HOME/gradle-8.1"

          unzip -q /tmp/gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.1/bin" >> "$GITHUB_PATH"

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          ls -la "$ANDROID_HOME/platforms/android-34"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace --info assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ArcInjector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
